# 河流水质站日 CSV 发布服务：两个实例共享同一卷，验证跨实例并发安全。
# 启动：docker compose up --build
# 实例 A 文档：http://localhost:8001/docs   实例 B 文档：http://localhost:8002/docs
# 共享卷内：blobs/ 原件、deltas/ 差分文档、release.db 目录库、tmp/ 临时文件。
x-service-env: &service-env
  DATA_DIR: /data
  MAX_FILE_BYTES: "1048576"   # 单件/重建全文 1 MiB
  MAX_RELEASES: "128"         # 累计 128 件，对应 Merkle 树深度 7
  MAX_DELTA_DEPTH: "4"        # 每件还原最多应用 4 层差分，超出提示整件上传
  MAX_DELTA_SEGMENTS: "8"     # 单次差分提交 1~8 个替换段

services:
  release-a:
    build: .
    image: water-quality-release:latest
    environment: *service-env
    ports:
      - "8001:8000"
    volumes:
      - shared-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  release-b:
    image: water-quality-release:latest
    build: .
    environment: *service-env
    ports:
      - "8002:8000"
    volumes:
      - shared-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - release-a

volumes:
  shared-data:
